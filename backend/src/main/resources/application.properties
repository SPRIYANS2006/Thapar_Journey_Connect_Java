# Server Port (Binds to cloud $PORT if provided, defaults to 8080)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=thapar-journey-connect

# Embedded H2 Database Configuration (Overridable via environment variables in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:thapar_journey;DB_CLOSE_DELAY=-1;MODE=LEGACY;NON_KEYWORDS=USER,VALUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Jackson JSON Configuration
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.default-property-inclusion=always

# JWT Session Configuration
app.jwt.secret=thapar-journey-connect-jwt-secret-academic-lab-2026-key-32bytes-min
app.jwt.expiration-ms=2592000000

# Google Client ID Configuration (Overridable via GOOGLE_CLIENT_ID environment variable)
app.google.client-id=${GOOGLE_CLIENT_ID:629250761631-k5eo83notfq2e1vuu3qvimbf1jq3lueo.apps.googleusercontent.com}

# Logging
logging.level.com.tiet.journeyconnect=INFO
